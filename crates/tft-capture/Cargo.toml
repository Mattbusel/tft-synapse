[package]
name = "tft-synapse-capture"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Live Client API and screen capture input for TFT Synapse."

[lib]
name = "tft_capture"

[lints]
workspace = true

[dependencies]
tft-types = { package = "tft-synapse-types", version = "0.6.0", path = "../tft-types" }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
reqwest = { version = "0.12", features = ["json", "blocking"] }
tokio = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
# windows: Win32 GDI + messaging APIs for BitBlt screen capture fallback
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
