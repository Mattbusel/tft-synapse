[package]
name = "tft-synapse-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "egui interface for TFT Synapse."

[lib]
name = "tft_ui"

[lints]
workspace = true

[dependencies]
tft-types = { package = "tft-synapse-types", version = "0.6.0", path = "../tft-types" }
tft-data = { package = "tft-synapse-data", version = "0.6.0", path = "../tft-data" }
tft-advisor = { package = "tft-synapse-advisor", version = "0.6.0", path = "../tft-advisor" }
tft-capture = { package = "tft-synapse-capture", version = "0.6.0", path = "../tft-capture" }
eframe = { workspace = true }
egui = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tokio = { workspace = true }
# dirs-next: cross-platform home directory lookup for export paths
dirs-next = "2.0"

[target.'cfg(target_os = "windows")'.dependencies]
# windows: Win32 API bindings for overlay transparency and click-through
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }
