[package]
name = "tft-synapse"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "TFT Synapse - AI-powered TFT advisor and auto-player platform"
readme = "../../README.md"
keywords = ["tft", "teamfight-tactics", "advisor", "egui"]
categories = ["games"]

[[bin]]
name = "tft-synapse"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
tft-types = { package = "tft-synapse-types", version = "0.6.0", path = "../tft-types" }
tft-data = { package = "tft-synapse-data", version = "0.6.0", path = "../tft-data" }
tft-advisor = { package = "tft-synapse-advisor", version = "0.6.0", path = "../tft-advisor" }
tft-capture = { package = "tft-synapse-capture", version = "0.6.0", path = "../tft-capture" }
tft-ui = { package = "tft-synapse-ui", version = "0.6.0", path = "../tft-ui" }
eframe = { workspace = true }
egui = { workspace = true }
clap = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
reqwest = { workspace = true }
serde_json = { workspace = true }
