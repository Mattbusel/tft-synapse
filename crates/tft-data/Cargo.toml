[package]
name = "tft-synapse-data"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Game data catalog (augments, champions, traits, items) for TFT Synapse."

[lib]
name = "tft_data"

[lints]
workspace = true

[dependencies]
tft-types = { package = "tft-synapse-types", version = "0.6.0", path = "../tft-types" }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# dirs-next: cross-platform home directory resolution for hot-reload catalog path
dirs-next = "2.0"

[dev-dependencies]
# tempfile: create temp files in tests for from_json_file coverage
tempfile = "3"
